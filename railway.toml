[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 60"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
APP_ENV = "production"
DATABASE_URL = "sqlite:////app/data/app.db"
LOG_LEVEL = "INFO"
DEFAULT_USER_NAME = "Naresh"
SEED_ON_START = "true"

# Mount a Railway volume at /app/data so SQLite survives redeploys.
[[volumes]]
mountPath = "/app/data"